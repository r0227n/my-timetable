labels:
  - name: bug
    color: d73a4a
    description: 仕様と異なる動作や不具合
  - name: enhancement
    color: a2eeef
    description: 新機能または既存機能の改善
  - name: agent-created
    color: 5319e7
    description: AI Agentによって起票されたIssue
  - name: needs-triage
    color: fbca04
    description: 人間による内容確認と優先度判断が必要
  - name: bot:execute
    color: 0e8a16
    description: 将来の自動実行基盤へIssueの取得と実装を許可
  - name: bot:running
    color: 1d76db
    description: BotがIssueを取得して実行中
  - name: bot:done
    color: 6f42c1
    description: BotがPRのmergeまで完了
  - name: bot:blocked
    color: b60205
    description: 人間の判断または外部状態の変更を待機中
